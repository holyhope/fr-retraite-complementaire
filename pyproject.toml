[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fr-retraite-complementaire"
version = "0.1.0"
description = "Compute French Agirc-Arrco supplementary pension annuities from a career's point history."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Pierre Péronnet" }]
keywords = ["agirc", "arrco", "retraite", "pension", "france"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.scripts]
fr-retraite-complementaire = "fr_retraite_complementaire.cli:main"

[project.urls]
Homepage = "https://github.com/holyhope/fr-retraite-complementaire"
Repository = "https://github.com/holyhope/fr-retraite-complementaire"

[tool.hatch.build.targets.wheel]
packages = ["src/fr_retraite_complementaire"]

[tool.hatch.build.targets.sdist]
include = ["src/fr_retraite_complementaire", "README.md", "LICENSE"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

